<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bobercad Viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="bc-workspace-shell" aria-label="Bobercad workspace">
      <canvas id="view"></canvas>
      <header class="bc-topbar">
        <div class="bc-brand" aria-label="Bobercad">
          <span class="bc-brand-mark" aria-hidden="true">B</span>
          <span class="bc-brand-name">Bobercad</span>
        </div>
        <nav class="bc-app-menu" aria-label="Application menu">
          <button id="topbar-file-open" class="bc-topbar-menu-button" type="button">File</button>
          <button id="workspace-customize-open" class="bc-topbar-menu-button" type="button">Settings</button>
        </nav>
        <nav id="feature-navbar" class="bc-feature-navbar" aria-label="Feature navigation"></nav>
        <div class="bc-topbar-actions">
          <button id="reference-import-open" type="button">Import IFC/DXF</button>
          <input id="reference-import-input" type="file" accept=".dxf,.dwg,.step,.stp,.ste,.p21,.stpx,.stpnc,.stepnc,.ifc,.ifcxml,.ifczip,.e57,.e57pointcloud,.e57-point-cloud,.e57_point_cloud,.xyz,.pts,.ptx,.asc,.txt,.csv,.pcd,.ply,.las,.laz,.obj,.json,.zip,.gz,.z,application/json" hidden>
          <button id="command-palette-open" type="button">Search</button>
        </div>
      </header>
      <div class="bc-viewer-settings-band" aria-label="Viewer settings">
        <button id="reset" class="bc-icon-button bc-viewer-overlay-action" type="button" title="Reset view" aria-label="Reset view">Reset view</button>
        <div id="viewer-settings-strip" class="bc-viewer-settings-strip" aria-label="Viewer settings"></div>
      </div>
      <div class="bc-toolbar-band" aria-label="Modeling tools">
        <div id="modeling-toolbar" aria-label="Modeling toolbar"></div>
      </div>
      <aside class="bc-left-dock" aria-label="Data and library dock">
        <aside id="library-panel" hidden>
          <section id="project-properties-panel" aria-label="Project properties"></section>
          <section id="project-files-panel" aria-label="Project files"></section>
          <section id="project-data-panel" aria-label="Project data"></section>
          <section id="model-browser" aria-label="Project model browser"></section>
          <section id="connection-component-library" aria-label="Connection component library"></section>
          <section id="smart-component-library" aria-label="Smart Component library"></section>
        </aside>
      </aside>
      <aside class="bc-right-dock" aria-label="Properties dock">
        <aside class="bc-inspector-slot" data-inspector-context-panel="properties" hidden></aside>
        <aside class="bc-inspector-slot" data-inspector-context-panel="feature" hidden></aside>
        <aside class="bc-inspector-slot" data-inspector-context-panel="component" hidden></aside>
      </aside>
      <div class="bc-floating-layer" aria-label="Floating edit panels">
        <aside id="member-transform-panel" hidden></aside>
      </div>
      <div id="nav-cube" class="bc-nav-cube" aria-label="View orientation"></div>
      <footer class="bc-statusbar">
        <div id="modeling-status">Ready</div>
        <div id="hud" class="bc-project-summary" aria-label="Project summary">
          <div id="title">Loading</div>
          <div id="meta"></div>
        </div>
      </footer>
      <div id="command-palette" hidden></div>
    </div>
    <script type="module" src="./viewer-runtime.mjs"></script>
  </body>
</html>
